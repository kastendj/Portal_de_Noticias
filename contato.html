<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contato</title>
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/contato.css" />
  </head>

  <body>
    <header>
      <h1>Portal de Notícias</h1>
      <p>Programação, Experiências e Cotidiano</p>

      <nav>
        <ul>
          <li><a href="index.html">Programação</a></li>
          <li><a href="hobbies.html">Hobbies</a></li>
          <li><a href="perfil.html">Sobre Mim</a></li>
          <li><a href="contato.html" aria-current="page">Contato</a></li>
        </ul>
      </nav>
    </header>

    <!-- Conteúdo principal -->
    <main class="pagina-contato">
      <section class="contato">
        <header>
          <h1>Vamos conversar?</h1>
        </header>

        <form method="post" action="#" enctype="multipart/form-data">
          <div class="campo">
            <label for="nome">Nome:</label>
            <input
              type="text"
              name="nome"
              id="nome"
              required
              minlength="3"
              maxlength="60"
            />
          </div>

          <div class="campo">
            <label for="email">E-mail:</label>
            <input
              type="email"
              name="email"
              id="email"
              placeholder="seu.email@gmail.com"
              required
            />
          </div>

          <div class="campo">
            <label for="mensagem">Mensagem:</label>
            <textarea
              name="mensagem"
              id="mensagem"
              rows="4"
              required
              minlength="10"
              maxlength="500"
            ></textarea>
          </div>

          <!-- Novos campos -->
          <div class="campo">
            <label for="site">Site / Portfólio:</label>
            <input type="url" name="site" id="site" placeholder="https://..." />
          </div>

          <div class="campo">
            <label for="nascimento">Data de nascimento:</label>
            <input type="date" name="nascimento" id="nascimento" />
          </div>

          <div class="campo">
            <label for="telefone">Telefone:</label>
            <input
              type="tel"
              name="telefone"
              id="telefone"
              pattern="[0-9]{10,11}"
              placeholder="Ex.: 47999999999"
            />
          </div>

          <div class="campo">
            <label for="interesse">Nível de interesse (0 a 10):</label>
            <input
              type="range"
              name="interesse"
              id="interesse"
              min="0"
              max="10"
              value="5"
            />
          </div>

          <div class="campo">
            <label for="cor">Cor favorita:</label>
            <input type="color" name="cor" id="cor" value="#173b82" />
          </div>

          <div class="campo">
            <label for="anexo">Anexar arquivo (png, jpg, jpeg ou pdf):</label>
            <input
              type="file"
              id="anexo"
              name="anexo"
              accept=".png,.jpg,.jpeg,.pdf"
            />
          </div>

          <fieldset>
            <legend>Interesses (pode marcar vários):</legend>
            <label>
              <input type="checkbox" name="interesses" value="frontend" />
              Front-end
            </label>
            <label>
              <input type="checkbox" name="interesses" value="backend" />
              Back-end
            </label>
            <label>
              <input type="checkbox" name="interesses" value="redes" />
              Redes
            </label>
          </fieldset>

          <fieldset>
            <legend>Forma de contato preferida:</legend>
            <label>
              <input type="radio" name="preferencia" value="email" required />
              E-mail
            </label>
            <label>
              <input type="radio" name="preferencia" value="telefone" />
              Telefone
            </label>
            <label>
              <input type="radio" name="preferencia" value="whatsapp" />
              WhatsApp
            </label>
          </fieldset>

          <button type="submit">Enviar</button>
        </form>
      </section>
    </main>

    <footer>
      <p>Projeto desenvolvido na disciplina de Desenvolvimento Web I</p>
      <p>IFC - Campus Araquari</p>
    </footer>
  </body>
</html>
